name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  desktop:
    name: Build desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Build uni-app H5
        run: yarn build:h5

      - name: Download Neutralino binaries
        run: |
          cd uniapp/neutralino
          yarn neu update
          # neu update downloads binaries to bin/ directory
          ls -la bin/

      - name: Build Neutralino app
        run: |
          # neu build has a bug: it creates .tmp/ in CWD and then tries
          # to copy ./ into it. Workaround: run from a temp directory
          # and use --config-file to point to the project.
          ROOT="$PWD"
          H5_DIR="$ROOT/uniapp/dist/build/h5"
          NEU_BIN="$ROOT/uniapp/neutralino/bin"
          BINARY_NAME="ejunz-edge-desktop"
          NEU_DIR="/tmp/neu-build"
          rm -rf "$NEU_DIR"
          mkdir -p "$NEU_DIR/project"

          # Copy H5 build output as the document root
          cp -r "$H5_DIR"/* "$NEU_DIR/project/"

          # Copy neutralino config
          cp "$ROOT/uniapp/neutralino/neutralino.config.json" "$NEU_DIR/"

          # Build from a temp dir so .tmp/ is outside the project
          cd /tmp
          npx @neutralinojs/neu build --release \
            --config-file "$NEU_DIR/neutralino.config.json"

          # Copy dist output to known location
          mkdir -p "$NEU_DIR/dist"
          cp -r /tmp/dist/* "$NEU_DIR/dist/" 2>/dev/null || true

          # Copy and rename Neutralino binaries
          if [ -d "$NEU_BIN" ]; then
            for f in "$NEU_BIN"/neutralino-*; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              suffix="${base#neutralino-}"
              cp "$f" "$NEU_DIR/dist/$BINARY_NAME/$BINARY_NAME-$suffix"
              chmod +x "$NEU_DIR/dist/$BINARY_NAME/$BINARY_NAME-$suffix"
            done
          fi
          ls -la "$NEU_DIR/dist/$BINARY_NAME/" 2>/dev/null || ls -la "$NEU_DIR/dist/"

      - name: Package artifacts
        run: .github/scripts/package-desktop.sh /tmp/packages
        env:
          NEU_DIST_DIR: /tmp/neu-build/dist/ejunz-edge-desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-packages
          path: /tmp/packages/*
          retention-days: 1

  h5:
    name: Build H5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Build uni-app H5
        run: yarn build:h5

      - name: Upload H5 build
        uses: actions/upload-artifact@v4
        with:
          name: h5-build
          path: uniapp/dist/build/h5/
          retention-days: 1

  dmg:
    name: Create macOS DMGs
    runs-on: macos-latest
    needs: desktop
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          name: desktop-packages
          path: /tmp/packages

      - name: Create DMGs from macOS .app bundles
        run: |
          set -e
          mkdir -p /tmp/dmgs
          for pkg in /tmp/packages/ejunz-edge-desktop-mac-*.tar.gz; do
            [ -f "$pkg" ] || continue
            arch=$(basename "$pkg" | sed 's/ejunz-edge-desktop-mac-//; s/\.tar\.gz//')
            staging="/tmp/dmg-staging-${arch}"
            mkdir -p "$staging"
            tar -xzf "$pkg" -C "$staging"
            app_path=$(find "$staging" -name "*.app" -type d | head -1)
            if [ -n "$app_path" ]; then
              dmg_src="/tmp/dmg-src-${arch}"
              mkdir -p "$dmg_src"
              cp -R "$app_path" "$dmg_src/"
              ln -s /Applications "$dmg_src/Applications"
              hdiutil create -volname "Ejunz Edge" -srcfolder "$dmg_src" -ov -format UDZO \
                "/tmp/dmgs/ejunz-edge-desktop-mac-${arch}.dmg"
            fi
          done

      - name: Upload DMGs
        uses: actions/upload-artifact@v4
        with:
          name: dmgs
          path: /tmp/dmgs/*
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [desktop, dmg]
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          name: desktop-packages
          path: /tmp/release

      - name: Download DMGs
        uses: actions/download-artifact@v4
        with:
          name: dmgs
          path: /tmp/release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release/**
          generate_release_notes: true
