name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.1.5)
        required: true
        type: string

permissions:
  contents: write

jobs:
  desktop:
    name: Build desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Build uni-app H5
        run: yarn build:h5

      - name: Download Neutralino binaries
        run: |
          cd uniapp/neutralino
          yarn exec neu update
          # neu update downloads binaries to bin/ directory
          ls -la bin/

      - name: Build Neutralino app
        run: |
          # Build resources.neu manually (zip of H5 output), then
          # embed it into the Neutralino binary so it's self-contained.
          ROOT="$PWD"
          H5_DIR="$ROOT/uniapp/dist/build/h5"
          NEU_BIN="$ROOT/uniapp/neutralino/bin"
          BINARY_NAME="ejunz-edge-desktop"
          NEU_DIR="/tmp/neu-build"
          rm -rf "$NEU_DIR"
          mkdir -p "$NEU_DIR/www" "$NEU_DIR/dist/$BINARY_NAME"

          # Copy H5 build output
          cp -r "$H5_DIR"/* "$NEU_DIR/www/"

          # Create resources.neu (zip of www contents, store mode)
          cd "$NEU_DIR/www"
          zip -r -0 "$NEU_DIR/dist/$BINARY_NAME/resources.neu" . > /dev/null

          # Copy and rename Neutralino binaries
          if [ -d "$NEU_BIN" ]; then
            for f in "$NEU_BIN"/neutralino-*; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              suffix="${base#neutralino-}"
              cp "$f" "$NEU_DIR/dist/$BINARY_NAME/$BINARY_NAME-$suffix"
              chmod +x "$NEU_DIR/dist/$BINARY_NAME/$BINARY_NAME-$suffix"
            done
          fi
          ls -la "$NEU_DIR/dist/$BINARY_NAME/"

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm zip

      - name: Package artifacts
        run: .github/scripts/package-desktop.sh /tmp/packages
        env:
          NEU_DIST_DIR: /tmp/neu-build/dist/ejunz-edge-desktop
          WINDOWS_STAGING_DIR: /tmp/windows-installer-input
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-packages
          path: /tmp/packages/*
          retention-days: 1

      - name: Upload Windows installer inputs
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-input
          path: /tmp/windows-installer-input/*
          retention-days: 1

  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows installer inputs
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-input
          path: packages

      - name: Install Windows packaging tools
        shell: pwsh
        run: choco install innosetup wixtoolset --no-progress --yes

      - name: Build setup executable
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          if (-not (Test-Path packages/ejunz-edge-desktop-win_x64.exe)) { throw 'Windows installer executable was not found' }
          if (-not (Test-Path packages/resources.neu)) { throw 'Neutralino resources were not found' }
          New-Item -ItemType Directory -Path installer -Force | Out-Null
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $sourceDir = (Resolve-Path packages).Path
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/O$((Resolve-Path installer).Path)" "/DAppVersion=$version" "/DSourceDir=$sourceDir" packaging/windows/ejunz-edge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer

      - name: Build MSI installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $sourceDir = (Resolve-Path packages).Path
          $wixRoot = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset*'
          $candle = Get-ChildItem $wixRoot -Filter candle.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $light = Get-ChildItem $wixRoot -Filter light.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $candle -or -not $light) { throw 'WiX Toolset candle.exe/light.exe was not found' }
          $wixObj = Join-Path $env:RUNNER_TEMP 'ejunz-edge.wixobj'
          $msi = Join-Path (Resolve-Path installer).Path "Ejunz Edge_${version}_x64_en-US.msi"
          & $candle.FullName "-dAppVersion=$version" "-dSourceDir=$sourceDir" '-arch' 'x64' '-out' $wixObj packaging/windows/ejunz-edge.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $light.FullName '-out' $msi $wixObj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item $msi

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            installer/*.exe
            installer/*.msi
          retention-days: 1

  h5:
    name: Build H5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Build uni-app H5
        run: yarn build:h5

      - name: Upload H5 build
        uses: actions/upload-artifact@v4
        with:
          name: h5-build
          path: uniapp/dist/build/h5/
          retention-days: 1

  dmg:
    name: Create macOS DMGs
    runs-on: macos-latest
    needs: desktop
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          name: desktop-packages
          path: /tmp/packages

      - name: Create DMGs from macOS .app bundles
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -e
          mkdir -p /tmp/dmgs
          version="${RELEASE_VERSION#v}"
          for pkg in /tmp/packages/Ejunz\ Edge_*_mac-*.tar.gz; do
            [ -f "$pkg" ] || continue
            filename=$(basename "$pkg")
            arch="${filename##*_mac-}"
            arch="${arch%.tar.gz}"
            output_arch="$arch"
            [ "$arch" = "arm64" ] && output_arch="aarch64"
            staging="/tmp/dmg-staging-${arch}"
            mkdir -p "$staging"
            tar -xzf "$pkg" -C "$staging"
            app_path=$(find "$staging" -name "*.app" -type d | head -1)
            if [ -n "$app_path" ]; then
              dmg_src="/tmp/dmg-src-${arch}"
              mkdir -p "$dmg_src"
              cp -R "$app_path" "$dmg_src/"
              ln -s /Applications "$dmg_src/Applications"
              hdiutil create -volname "Ejunz Edge" -srcfolder "$dmg_src" -ov -format UDZO \
                "/tmp/dmgs/Ejunz Edge_${version}_${output_arch}.dmg"
            fi
          done

      - name: Upload DMGs
        uses: actions/upload-artifact@v4
        with:
          name: dmgs
          path: /tmp/dmgs/*
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [desktop, dmg, windows-installer]
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          name: desktop-packages
          path: /tmp/release

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: /tmp/release

      - name: Download DMGs
        uses: actions/download-artifact@v4
        with:
          name: dmgs
          path: /tmp/release

      - name: Remove intermediate archives
        run: |
          find /tmp/release -type f -not -name '*.rpm' -not -name '*.deb' -not -name '*.AppImage' -not -name '*.dmg' -not -name '*-setup.exe' -not -name '*.msi' -delete
          find /tmp/release -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release/**
          generate_release_notes: true
