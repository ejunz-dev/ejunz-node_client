name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  desktop:
    name: Build desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Build uni-app H5
        run: yarn build:h5

      - name: Download Neutralino binaries
        run: |
          cd uniapp/neutralino
          yarn neu update

      - name: Build Neutralino app
        run: |
          cd uniapp/neutralino
          yarn neu build --release

      - name: Package artifacts
        run: .github/scripts/package-desktop.sh /tmp/packages

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-packages
          path: /tmp/packages/*
          retention-days: 1

  h5:
    name: Build H5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Build uni-app H5
        run: yarn build:h5

      - name: Upload H5 build
        uses: actions/upload-artifact@v4
        with:
          name: h5-build
          path: uniapp/dist/build/h5/
          retention-days: 1

  dmg:
    name: Create macOS DMGs
    runs-on: macos-latest
    needs: desktop
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          name: desktop-packages
          path: /tmp/packages

      - name: Create DMGs from macOS .app bundles
        run: |
          set -e
          mkdir -p /tmp/dmgs
          for pkg in /tmp/packages/ejunz-edge-desktop-mac-*.tar.gz; do
            [ -f "$pkg" ] || continue
            arch=$(basename "$pkg" | sed 's/ejunz-edge-desktop-mac-//; s/\.tar\.gz//')
            staging="/tmp/dmg-staging-${arch}"
            mkdir -p "$staging"
            tar -xzf "$pkg" -C "$staging"
            app_path=$(find "$staging" -name "*.app" -type d | head -1)
            if [ -n "$app_path" ]; then
              dmg_src="/tmp/dmg-src-${arch}"
              mkdir -p "$dmg_src"
              cp -R "$app_path" "$dmg_src/"
              ln -s /Applications "$dmg_src/Applications"
              hdiutil create -volname "Ejunz Edge" -srcfolder "$dmg_src" -ov -format UDZO \
                "/tmp/dmgs/ejunz-edge-desktop-mac-${arch}.dmg"
            fi
          done

      - name: Upload DMGs
        uses: actions/upload-artifact@v4
        with:
          name: dmgs
          path: /tmp/dmgs/*
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [desktop, h5, dmg]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release

      - name: Flatten artifacts
        run: |
          mkdir -p /tmp/flat
          find /tmp/release -type f -exec cp {} /tmp/flat/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/flat/*
          generate_release_notes: true
