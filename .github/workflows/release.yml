name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.1.6)
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  linux:
    name: Build Linux desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm

      - name: Build Electron packages
        run: yarn workspace @ejunz/node-client-uniapp build:desktop

      - name: Normalize Linux artifact names
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          mkdir -p /tmp/release/linux
          for package in uniapp/dist/electron/*; do
            [ -f "$package" ] || continue
            case "$package" in
              *.rpm) cp "$package" "/tmp/release/linux/Ejunz Edge-${version}-1.x86_64.rpm" ;;
              *.deb) cp "$package" "/tmp/release/linux/Ejunz Edge_${version}_amd64.deb" ;;
              *.AppImage) cp "$package" "/tmp/release/linux/Ejunz Edge_${version}_amd64.AppImage" ;;
            esac
          done
          test -f "/tmp/release/linux/Ejunz Edge-${version}-1.x86_64.rpm"
          test -f "/tmp/release/linux/Ejunz Edge_${version}_amd64.deb"
          test -f "/tmp/release/linux/Ejunz Edge_${version}_amd64.AppImage"
          find /tmp/release/linux -type f -print

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: /tmp/release/linux/*
          retention-days: 1

  windows:
    name: Build Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Install Windows packaging tools
        shell: pwsh
        run: choco install wixtoolset --no-progress --yes

      - name: Build Electron installers
        run: yarn workspace @ejunz/node-client-uniapp build:desktop

      - name: Normalize Windows artifact names
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $exe = Get-ChildItem uniapp/dist/electron -Filter '*.exe' -File | Select-Object -First 1
          $msi = Get-ChildItem uniapp/dist/electron -Filter '*.msi' -File | Select-Object -First 1
          if (-not $exe) { throw 'Electron setup executable was not produced' }
          if (-not $msi) { throw 'Electron MSI installer was not produced' }
          Copy-Item $exe.FullName "release/Ejunz Edge_${version}_x64-setup.exe"
          Copy-Item $msi.FullName "release/Ejunz Edge_${version}_x64_en-US.msi"
          Get-ChildItem release

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release/*
          retention-days: 1

  macos:
    name: Build macOS desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Build Electron DMG
        run: yarn workspace @ejunz/node-client-uniapp build:desktop

      - name: Normalize macOS artifact names
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          mkdir -p /tmp/release/macos
          for package in uniapp/dist/electron/*.dmg; do
            [ -f "$package" ] || continue
            name=$(basename "$package")
            case "$name" in
              *arm64*) arch=aarch64 ;;
              *universal*) arch=universal ;;
              *x64*) arch=x64 ;;
              *) arch=aarch64 ;;
            esac
            cp "$package" "/tmp/release/macos/Ejunz Edge_${version}_${arch}.dmg"
          done
          compgen -G '/tmp/release/macos/*.dmg' >/dev/null
          find /tmp/release/macos -type f -print

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: /tmp/release/macos/*
          retention-days: 1

  h5:
    name: Build H5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Build H5
        run: yarn build:h5

      - name: Upload H5 build
        uses: actions/upload-artifact@v4
        with:
          name: h5-build
          path: uniapp/dist/build/h5/
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: /tmp/release

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: /tmp/release

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          name: macos-packages
          path: /tmp/release

      - name: List release assets
        run: find /tmp/release -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release/**
          generate_release_notes: true
