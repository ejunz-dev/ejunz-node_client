name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Desktop (Neutralino.js) ──────────────────────────────────────────
  desktop:
    name: Build desktop (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: armhf
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build uni-app H5
        run: yarn build:h5

      - name: Download Neutralino binary (${{ matrix.platform }}_${{ matrix.arch }})
        run: |
          cd uniapp/neutralino
          yarn neu update
        env:
          NEU_OS: ${{ matrix.platform }}
          NEU_ARCH: ${{ matrix.arch }}

      - name: Build Neutralino app
        run: |
          cd uniapp/neutralino
          yarn neu build --release --arch ${{ matrix.arch }} --os ${{ matrix.platform }}

      - name: Package artifact
        shell: bash
        run: |
          set -e
          BINARY_NAME="ejunz-edge-desktop"
          DIST_DIR="uniapp/neutralino/dist/${BINARY_NAME}"
          PKG_DIR="/tmp/package"
          mkdir -p "$PKG_DIR"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Windows: zip the .exe + resources
            cp "${DIST_DIR}/${BINARY_NAME}-win_x64.exe" "$PKG_DIR/"
            cp "${DIST_DIR}/resources.neu" "$PKG_DIR/"
            cd "$PKG_DIR"
            7z a -tzip "/tmp/ejunz-edge-desktop-win-x64.zip" .
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            # macOS: create .app bundle
            APP_DIR="$PKG_DIR/Ejunz Edge.app"
            mkdir -p "$APP_DIR/Contents/MacOS"
            cp "${DIST_DIR}/${BINARY_NAME}-mac_${{ matrix.arch }}" "$APP_DIR/Contents/MacOS/${BINARY_NAME}"
            cp "${DIST_DIR}/resources.neu" "$APP_DIR/Contents/MacOS/"
            chmod +x "$APP_DIR/Contents/MacOS/${BINARY_NAME}"
            cat > "$APP_DIR/Contents/Info.plist" <<'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>CFBundleName</key><string>Ejunz Edge</string>
  <key>CFBundleDisplayName</key><string>Ejunz Edge</string>
  <key>CFBundleIdentifier</key><string>com.ejunz.edge.desktop</string>
  <key>CFBundleVersion</key><string>${GITHUB_REF_NAME#v}</string>
  <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
  <key>CFBundlePackageType</key><string>APPL</string>
  <key>CFBundleExecutable</key><string>${BINARY_NAME}</string>
  <key>LSMinimumSystemVersion</key><string>11.0</string>
  <key>NSHighResolutionCapable</key><true/>
</dict>
</plist>
PLIST
            # Create DMG
            DMG_STAGING="/tmp/dmg-staging-${{ matrix.arch }}"
            mkdir -p "$DMG_STAGING"
            cp -R "$PKG_DIR/Ejunz Edge.app" "$DMG_STAGING/"
            ln -s /Applications "$DMG_STAGING/Applications"
            hdiutil create -volname "Ejunz Edge" -srcfolder "$DMG_STAGING" -ov -format UDZO \
              "/tmp/ejunz-edge-desktop-mac-${{ matrix.arch }}.dmg"
          else
            # Linux: tar.gz the binary + resources
            cp "${DIST_DIR}/${BINARY_NAME}-linux_${{ matrix.arch }}" "$PKG_DIR/"
            cp "${DIST_DIR}/resources.neu" "$PKG_DIR/"
            chmod +x "$PKG_DIR/${BINARY_NAME}-linux_${{ matrix.arch }}"
            cd "$PKG_DIR"
            NAME=$(echo "${{ matrix.arch }}" | tr '_' '-')
            tar -czvf "/tmp/ejunz-edge-desktop-linux-${NAME}.tar.gz" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: /tmp/ejunz-edge-desktop-*
          retention-days: 1

  # ── H5 (static site) ───────────────────────────────────────────────
  h5:
    name: Build H5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build uni-app H5
        run: yarn build:h5

      - name: Upload H5 build
        uses: actions/upload-artifact@v4
        with:
          name: h5-build
          path: uniapp/dist/build/h5/
          retention-days: 1

  # ── Publish GitHub Release ──────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [desktop, h5]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release

      - name: Flatten artifacts
        run: |
          mkdir -p /tmp/flat
          find /tmp/release -type f -exec cp {} /tmp/flat/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/flat/*
          generate_release_notes: true
