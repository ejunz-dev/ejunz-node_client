name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  desktop:
    name: Build desktop (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            ext: AppImage
          - os: macos-latest
            target: mac
            ext: dmg
          - os: windows-latest
            target: win
            ext: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Install dependencies
        run: yarn install

      - name: Build uni-app H5
        run: yarn build:h5

      - name: Build Tauri app
        run: |
          cd uniapp
          npx tauri build

      - name: Upload artifact
        shell: bash
        run: |
          BUNDLE="uniapp/src-tauri/target/release/bundle"
          STAGING="/tmp/artifacts/${{ matrix.target }}"
          mkdir -p "$STAGING"
          # Copy from each bundle subdirectory
          for dir in "$BUNDLE"/*/; do
            [ -d "$dir" ] || continue
            for f in "$dir"/*; do
              [ -f "$f" ] || continue
              case "$f" in
                *.AppImage|*.deb|*.rpm|*.dmg|*.msi|*.exe|*.zip)
                  cp "$f" "$STAGING/" ;;
              esac
            done
          done
          echo "Uploading:"
          ls -la "$STAGING/"
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: /tmp/artifacts/${{ matrix.target }}/*
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release

      - name: Flatten artifacts
        run: |
          mkdir -p /tmp/flat
          find /tmp/release -type f -exec cp {} /tmp/flat/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/flat/*
          generate_release_notes: true
