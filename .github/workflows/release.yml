name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build desktop client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build desktop frontend
        run: yarn workspace @ejunz/node-client-desktop-ui build

      - name: Build Neutralino app
        run: |
          cd desktop
          yarn neu update
          yarn neu build --release

      - name: Package Linux/Windows artifacts
        run: |
          set -e
          cd desktop/dist/ejunz-edge-desktop
          chmod +x ejunz-edge-desktop-linux_* ejunz-edge-desktop-mac_*
          mkdir -p /tmp/packages
          for target in linux_x64 linux_arm64 linux_armhf; do
            name=$(echo "$target" | tr '_' '-')
            tar -czvf "/tmp/packages/ejunz-edge-desktop-${name}.tar.gz" resources.neu "ejunz-edge-desktop-${target}"
          done
          zip -r /tmp/packages/ejunz-edge-desktop-win-x64.zip resources.neu ejunz-edge-desktop-win_x64.exe

      - name: Assemble macOS .app bundles
        run: |
          set -e
          cd desktop/dist/ejunz-edge-desktop
          mkdir -p /tmp/apps
          for arch in arm64 x64 universal; do
            app="/tmp/apps/${arch}/Ejunz Edge.app"
            mkdir -p "$app/Contents/MacOS"
            cp "ejunz-edge-desktop-mac_${arch}" "$app/Contents/MacOS/ejunz-edge-desktop"
            cp resources.neu "$app/Contents/MacOS/"
            chmod +x "$app/Contents/MacOS/ejunz-edge-desktop"
            cat > "$app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Ejunz Edge</string>
            <key>CFBundleDisplayName</key><string>Ejunz Edge</string>
            <key>CFBundleIdentifier</key><string>dev.ejunz.node.desktop</string>
            <key>CFBundleVersion</key><string>1.0.0</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>ejunz-edge-desktop</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          done

      - name: Upload Linux/Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: /tmp/packages/
          retention-days: 1

      - name: Upload macOS apps
        uses: actions/upload-artifact@v4
        with:
          name: mac-apps
          path: /tmp/apps/
          retention-days: 1

  dmg:
    name: Create macOS DMGs
    runs-on: macos-latest
    needs: build
    steps:
      - name: Download macOS apps
        uses: actions/download-artifact@v4
        with:
          name: mac-apps
          path: /tmp/apps

      - name: Create DMGs
        run: |
          set -e
          mkdir -p /tmp/dmg
          for arch in arm64 x64 universal; do
            staging="/tmp/staging-${arch}"
            mkdir -p "$staging"
            cp -R "/tmp/apps/${arch}/Ejunz Edge.app" "$staging/"
            chmod +x "$staging/Ejunz Edge.app/Contents/MacOS/ejunz-edge-desktop"
            ln -s /Applications "$staging/Applications"
            hdiutil create -volname "Ejunz Edge" -srcfolder "$staging" -ov -format UDZO \
              "/tmp/dmg/ejunz-edge-desktop-mac-${arch}.dmg"
          done

      - name: Upload DMGs
        uses: actions/upload-artifact@v4
        with:
          name: dmgs
          path: /tmp/dmg/
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, dmg]
    steps:
      - name: Download Linux/Windows packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: /tmp/release

      - name: Download DMGs
        uses: actions/download-artifact@v4
        with:
          name: dmgs
          path: /tmp/release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release/*
          generate_release_notes: true
